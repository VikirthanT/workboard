# The single public door (HTTP). /api goes to the API container, everything else to the frontend container.
# HTTPS (port 443, certificate) plugs in here later; nothing else changes.

# Like nginx's default "combined" format, but with $uri (no query string) in place of $request.
log_format workboard '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Rate limits per visitor address. wb_api covers all of /api/ (a manager moving cards makes a few requests a minute;
# this is a ceiling against a runaway script). wb_auth is tighter and only counts the sign-in endpoints under
# /api/auth/: for every other path the map gives an empty key, and nginx does not count a request with no key.
# The app has its own per-login limits on top (server/security/rate_limit.py).
map $uri $wb_auth_key {
    ~^/api/auth/  $binary_remote_addr;
    default       "";
}
limit_req_zone $binary_remote_addr zone=wb_api:10m rate=600r/m;
limit_req_zone $wb_auth_key zone=wb_auth:10m rate=30r/m;

server {
    listen 80;
    server_tokens off;

    # The layer in front (which ends TLS) forwards the visitor's address in X-Forwarded-For. Believe that header only
    # from private addresses, and take the last entry that is not one: anything a visitor writes into the header sits
    # to the left of the address the front layer appended, so it cannot change which address is counted.
    # shortcut: visitors on the office's own private network are skipped over like the proxy; they then share one
    # limit. Name the front layer's exact address here once it is fixed.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Browsers act on this only when it arrives over HTTPS (they ignore it on plain HTTP), so it is safe to send here:
    # it takes effect through whatever terminates TLS in front of this container. No includeSubDomains or preload on
    # purpose: both are hard to take back. Raise max-age once HTTPS is known to stay.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The app uses none of these browser features.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Everything the app loads is its own (scripts, styles and fonts are bundled; the API is the same origin). The one
    # inline script is the theme setter in client/index.html, allowed by its hash: if you edit that script, update
    # the hash here (server/tests/test_deployment_config.py fails until you do). Styles allow inline because the UI
    # library adds style elements at run time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WWXY4IDjvWGQ1n+IoaeMCqNG3kYE9um3j+uNtqSB7m0='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The path only, never the query string: the one-time sign-in code travels in `?code=` and must not sit in the logs.
    access_log /var/log/nginx/access.log workboard;
    client_max_body_size 1m;  # every request but the upload below

    # The development sign-in must never be reachable from outside, whatever the API was started with: the API treats
    # the header X-Dev-User-Email as "I am this person" when DEV_AUTH is on, so it is blanked at this door, and the
    # dev-only account list is a 404 here. (docker-compose.yml also forces DEV_AUTH off; this is the second lock.)
    location /api/dev/ {
        return 404;
    }

    # The API's own documentation pages are not for the public. Without this the frontend would answer these paths
    # with its index.html and a status of 200, which scanners report as an exposed docs page.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # The bulk upload takes a spreadsheet of up to 2 MB (the API enforces that), so it gets a little more than the rest.
    location /api/tasks/import {
        client_max_body_size 3m;
        limit_req zone=wb_api burst=200 nodelay;
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dev-User-Email "";
    }

    location /api/ {
        limit_req zone=wb_api burst=200 nodelay;
        limit_req zone=wb_auth burst=15 nodelay;
        proxy_pass http://server:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dev-User-Email "";
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $http_host;
    }
}
